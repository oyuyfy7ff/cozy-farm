name: Build Cozy Farm

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.3"

jobs:
  web:
    name: Export Web
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] && [ "$HOME" != "/root" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi

      - name: Get Thai font (Sarabun)
        run: |
          mkdir -p fonts
          if [ ! -f fonts/Sarabun-Bold.ttf ]; then
            wget -q -O fonts/Sarabun-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/sarabun/Sarabun-Bold.ttf
          fi
          ls -la fonts

      - name: Import project
        run: godot --headless --import || true

      - name: Export Web
        run: |
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Upload Web zip
        uses: actions/upload-artifact@v4
        with:
          name: cozy-farm-web
          path: build/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] && [ "$HOME" != "/root" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi

      - name: Get Thai font (Sarabun)
        run: |
          mkdir -p fonts
          if [ ! -f fonts/Sarabun-Bold.ttf ]; then
            wget -q -O fonts/Sarabun-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/sarabun/Sarabun-Bold.ttf
          fi

      - name: Setup Android debug keystore + editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK (debug-signed)
        run: |
          mkdir -v -p build/android
          godot --headless --export-debug "Android" build/android/cozyfarm.apk
          ls -la build/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cozy-farm-apk
          path: build/android/cozyfarm.apk
